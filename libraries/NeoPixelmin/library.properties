sentence=Minimal WS2812B (NeoPixel) driver for CH32V003. Header-only, no dynamic allocation.
paragraph=Generates the 800 kHz bit waveform with SPI1 instead of cycle-counted GPIO toggling, so show() does not need to disable interrupts. DIN is fixed to pin 8 (PC6, SPI1 MOSI). Adafruit_NeoPixel compatible API subset. Define NEOPIXELMIN_MAX_LEDS before including the header - it is required, there is no default.
